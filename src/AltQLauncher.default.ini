; UTF-8 配置。修改后使用托盘菜单“重新扫描 / 应用配置”。
[Panel]
TriggerKey=Q
; Either=任一 Alt；Left=仅左 Alt；Right=仅右 Alt。AltGr 不用于唤起。
AltSide=Either
Columns=6
Rows=3
; 120–255，255 为不透明。
Opacity=242
FontSize=10
ShowOther=1
ShowAll=1

[Scan]
; 0 按下方 Rules 分类；1 优先用开始菜单一级文件夹分类。
UseMenuFolders=0
MaxItems=3000
MaxFiles=20000
; 正则匹配显示名称；留空可保留卸载入口。
ExcludeRegex=i)(uninstall|unins\d*|卸载|移除程序)

; 从上到下取第一条匹配；未命中进入“其他”。名称保留“全部”。
[Rules]
开发=i)(visual studio|vscode|code -|pycharm|idea|git|python|docker|terminal)
办公=i)(word|excel|powerpoint|onenote|office|wps|notion|obsidian|acrobat)
网络=i)(chrome|firefox|edge|浏览器|微信|wechat|qq|telegram|thunderbird)
影音=i)(vlc|potplayer|music|音乐|视频|obs studio|photoshop|gimp|blender)
工具=i)(7-zip|winrar|everything|powertoys|计算器|记事本)

; 每行：唯一编号=目录路径|固定分类|递归(0/1)。去掉示例行开头的分号启用。
; 默认不递归；递归会收录子目录里的 helper.exe，建议优先使用 Apps。
; 相对路径相对于脚本目录；支持 %USERPROFILE% 等环境变量和 %A_ScriptDir%。
[PortableRoots]
; 1=D:\Portable|便携|0
; 2=%USERPROFILE%\Tools|工具|1
; 3=Portable|便携|0

; 每行：显示名称=主程序完整路径|固定分类。支持 exe、lnk、url。
; 需要命令行参数时，请先创建 .lnk 快捷方式，再填写该快捷方式路径。
; 路径和分类中不要包含 |；INI 内不要在值后追加注释。
[Apps]
; Everything=D:\Portable\Everything\Everything.exe|工具
; VS Code 便携版=D:\Portable\VSCode\Code.exe|开发

; 留空时“全部”在最后；建议用设置窗口的“分类顺序”页调整。
[CategoryOrder]
